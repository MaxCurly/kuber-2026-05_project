apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: webhook-config
  namespace: monitoring
  labels:
    alertmanager: main
spec:
  route:
    receiver: 'webhook-notifications'
    groupBy: ['alertname', 'namespace']
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: 'webhook-notifications'
      webhookConfigs:
        - url: 'http://webhook-tester.monitoring.svc.cluster.local:8800/98a5da55-7528-4e04-bc58-088ceb130018'
          sendResolved: true