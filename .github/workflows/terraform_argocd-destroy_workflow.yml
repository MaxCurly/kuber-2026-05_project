name: 'terraform_argocd-destroy_workflow'

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите "destroy" для подтверждения удаления'
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform-destroy:
    name: 'terraform_argocd-destroy'
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.confirm == 'destroy' }}
    defaults:
      run:
        shell: bash
        working-directory: ./terraform/argocd-deploy/

    env:
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Write SA Key
      run: |
        echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}' > /tmp/key.json
        echo "YC_SERVICE_ACCOUNT_KEY_FILE=/tmp/key.json" >> $GITHUB_ENV

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Destroy
      run: terraform destroy -auto-approve -input=false
