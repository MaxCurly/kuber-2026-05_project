name: 'terraform_k8s-deploy_workflow'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: 'terraform_k8s-deploy'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: ./terraform/k8s-deploy/

    env:
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Write SA Key
      run: |
        echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}' > /tmp/key.json
        echo "YC_SERVICE_ACCOUNT_KEY_FILE=/tmp/key.json" >> $GITHUB_ENV

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false
