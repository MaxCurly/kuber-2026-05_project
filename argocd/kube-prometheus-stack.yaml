apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.7.0
      helm:
        skipCrds: true
        values: |
          crds:
            enabled: false
          grafana:
            service:
              type: LoadBalancer
            persistence:
              enabled: true
              size: 10Gi
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                url: http://loki-gateway.logging.svc.cluster.local
                access: proxy
          prometheus:
            prometheusSpec:
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              retention: 1d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: yc-network-hdd 
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
          alertmanager:
            alertmanagerSpec:
              alertmanagerConfigSelector:
                matchLabels:
                  alertmanager: main
              alertmanagerConfigNamespaceSelector: {}
              alertmanagerConfigMatcherStrategy:
                type: None
            config:
              global:
                resolve_timeout: 5m
              route:
                group_by: ['alertname', 'namespace']
                group_wait: 10s
                group_interval: 1m
                repeat_interval: 1m
                receiver: 'webhook-notifications'
                routes:
                  - receiver: 'null'
                    matchers:
                      - alertname="Watchdog"
              receivers:
                - name: 'null'
                - name: 'webhook-notifications'
                  webhook_configs:
                    - url: 'http://webhook-tester.monitoring.svc.cluster.local:8800/11111111-2222-3333-4444-555555555555'
                      send_resolved: true
    - repoURL: https://github.com/MaxCurly/kuber-2026-05_project.git
      targetRevision: HEAD
      path: grafana-dashboards/
    - repoURL: https://github.com/MaxCurly/kuber-2026-05_project.git
      targetRevision: HEAD
      path: prometheus-service-monitor/
    - repoURL: https://github.com/MaxCurly/kuber-2026-05_project.git
      targetRevision: HEAD
      path: prometheus-alertmanager-config/
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
