apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webhook-tester
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://tarampampam.github.io/webhook-tester/helm-charts
    chart: webhook-tester
    targetRevision: 2.2.3
    helm:
      values: |
        service:
          port: 8800
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true