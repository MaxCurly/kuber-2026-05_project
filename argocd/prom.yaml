apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"    # ← создаётся после CRD
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.6.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # Ваши кастомные значения
        grafana:
          enabled: true
          adminPassword: "admin"   # ← в продакшене используйте Secret
          ingress:
            enabled: false
        prometheus:
          prometheusSpec:
            retention: 15d
            resources:
              requests:
                memory: "2Gi"
                cpu: "500m"
        alertmanager:
          enabled: true
        # Отключаем повторную установку CRD (уже сделано в первом Application)
        crds:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true