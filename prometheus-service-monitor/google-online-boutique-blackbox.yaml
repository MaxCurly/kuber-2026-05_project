apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: google-online-boutique-blackbox
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  endpoints:

    # --- Frontend (HTTP) ---
    - port: http
      path: /probe
      interval: 30s
      scrapeTimeout: 10s
      params:
        module: [http_2xx]
        target: [frontend.google-online-boutique.svc.cluster.local:80]
      relabelings:
        - action: replace
          sourceLabels: [__param_target]
          targetLabel: instance
        - action: replace
          targetLabel: job
          replacement: google-online-boutique-frontend
      metricRelabelings:
        - action: replace
          sourceLabels: [__param_target]
          targetLabel: target

    # --- ProductCatalogService (gRPC) ---
    - port: http
      path: /probe
      interval: 30s
      scrapeTimeout: 10s
      params:
        module: [grpc_healthcheck]
        target: [productcatalogservice.google-online-boutique.svc.cluster.local:3550]
      relabelings:
        - action: replace
          sourceLabels: [__param_target]
          targetLabel: instance
        - action: replace
          targetLabel: job
          replacement: google-online-boutique-productcatalog
      metricRelabelings:
        - action: replace
          sourceLabels: [__param_target]
          targetLabel: target

    # --- CartService (gRPC) ---
    - port: http
      path: /probe
      interval: 30s
      scrapeTimeout: 10s
      params:
        module: [grpc_healthcheck]
        target: [cartservice.google-online-boutique.svc.cluster.local:7070]
      relabelings:
        - action: replace
          sourceLabels: [__param_target]
          targetLabel: instance
        - action: replace
          targetLabel: job
          replacement: google-online-boutique-cartservice
      metricRelabelings:
